@let p = product();

<div class="flex gap-5 rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
  <a [routerLink]="['/products', p._id]" class="shrink-0 self-start">
    <img [src]="p.imageCover" [alt]="p.title" class="size-28 rounded-xl bg-gray-50 object-contain p-3" />
  </a>

  <div class="flex min-w-0 flex-1 flex-col justify-between gap-3">
    <div>
      <a [routerLink]="['/products', p._id]" class="line-clamp-2 text-lg font-semibold text-gray-800 hover:text-primary-600">{{ p.title }}</a>
      <span class="mt-2 inline-block rounded-full bg-primary-50 px-3 py-1 text-xs text-primary-700">{{ p.category.name }}</span>
      <p class="mt-2 text-lg font-bold text-primary-600">{{ p.priceAfterDiscount || p.price | number: '1.0-0' }} EGP</p>
    </div>

    <div class="flex items-center gap-3">
      <button type="button" class="rounded-lg bg-primary-600 px-5 py-2 font-semibold text-white transition-colors hover:bg-primary-700" (click)="addToCart.emit()">
        <i class="fa-solid fa-cart-shopping mr-1"></i> Add to cart
      </button>
      <button type="button" class="flex size-10 items-center justify-center rounded-lg border border-red-100 bg-red-50 text-red-500 transition-colors hover:bg-red-100" (click)="remove.emit()">
        <i class="fa-solid fa-trash-can"></i>
      </button>
    </div>
  </div>
</div>
