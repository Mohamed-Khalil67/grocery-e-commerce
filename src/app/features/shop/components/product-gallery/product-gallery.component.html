<div>
  @if (selected(); as image) {
    <div class="overflow-hidden rounded-xl bg-white ring-1 ring-gray-100">
      <img [src]="image" alt="Product image" width="600" height="600" class="aspect-square w-full object-contain" />
    </div>
  }

  <div class="mt-4 flex flex-wrap gap-3">
    @for (image of images(); track image) {
      <button
        type="button"
        class="size-20 overflow-hidden rounded-lg border-2 bg-white transition"
        [class]="image === selected() ? 'border-green-600' : 'border-gray-200 hover:border-green-400'"
        (click)="selected.set(image)"
      >
        <img [src]="image" alt="Thumbnail" width="80" height="80" loading="lazy" class="size-full object-contain" />
      </button>
    }
  </div>
</div>
