@let l = line();

<div class="flex gap-5 rounded-2xl border border-gray-100 bg-white p-5 shadow-sm">
  <a [routerLink]="['/products', l.product._id]" class="shrink-0 self-start">
    <img [src]="l.product.imageCover" [alt]="l.product.title" class="size-28 rounded-xl bg-gray-50 object-contain p-3" />
  </a>

  <div class="flex min-w-0 flex-1 flex-col justify-between gap-3">
    <div>
      <a [routerLink]="['/products', l.product._id]" class="line-clamp-2 text-lg font-semibold text-gray-800 hover:text-primary-600">
        {{ l.product.title }}
      </a>
      <span class="mt-2 inline-block rounded-full bg-primary-50 px-3 py-1 text-xs text-primary-700">{{ l.product.category.name }}</span>
      <p class="mt-2 text-lg font-bold text-primary-600">{{ l.price | number: '1.0-0' }} EGP</p>
    </div>

    <div class="flex items-end justify-between gap-3">
      <app-quantity-stepper [value]="l.count" [min]="1" [max]="l.product.quantity" (changed)="quantityChange.emit($event)" />

      <div class="flex items-end gap-3">
        <div class="text-right">
          <p class="text-xs text-gray-400">Total</p>
          <p class="text-xl font-bold text-gray-900">
            {{ l.price * l.count | number: '1.0-0' }} <span class="text-sm font-normal text-gray-400">EGP</span>
          </p>
        </div>
        <button
          type="button"
          class="flex size-10 items-center justify-center rounded-lg border border-red-100 bg-red-50 text-red-500 transition-colors hover:bg-red-100"
          (click)="remove.emit()"
        >
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
    </div>
  </div>
</div>
