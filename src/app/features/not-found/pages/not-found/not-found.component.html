<div class="relative flex min-h-[70vh] items-center justify-center overflow-hidden bg-[#fafbfc] px-4 py-16">
  <i class="fa-solid fa-apple-whole absolute left-[5%] top-[10%] animate-float text-4xl text-primary-200" aria-hidden="true"></i>
  <i class="fa-solid fa-carrot absolute right-[10%] top-[20%] animate-float text-3xl text-primary-200" aria-hidden="true"></i>
  <i class="fa-solid fa-lemon absolute bottom-[25%] left-[8%] animate-float text-3xl text-primary-200" aria-hidden="true"></i>
  <i class="fa-solid fa-seedling absolute bottom-[15%] right-[15%] animate-float text-4xl text-primary-200" aria-hidden="true"></i>

  <div class="relative z-10 w-full max-w-xl">
    <div class="mb-10 flex justify-center">
      <div class="relative flex h-44 w-60 items-center justify-center rounded-3xl border border-gray-100 bg-white shadow-xl">
        <i class="fa-solid fa-cart-shopping text-7xl text-primary-400/80" aria-hidden="true"></i>
        <span class="absolute -right-3 -top-3 flex size-20 items-center justify-center rounded-full bg-gradient-to-br from-primary-500 to-primary-600 text-2xl font-black text-white shadow-lg">404</span>
      </div>
    </div>

    <div class="mb-10 text-center">
      <h1 class="mb-4 text-4xl font-black tracking-tight text-gray-900 sm:text-5xl">Oops! Nothing Here</h1>
      <p class="mx-auto max-w-md text-lg text-gray-500">Looks like this page went out of stock! Don't worry, there's plenty more fresh content to explore.</p>
    </div>

    <div class="mb-12 flex flex-col items-center justify-center gap-4 sm:flex-row">
      <a routerLink="/" class="inline-flex w-full items-center justify-center gap-3 rounded-2xl bg-primary-600 px-8 py-4 text-lg font-bold text-white shadow-lg transition-all hover:-translate-y-1 hover:bg-primary-700 sm:w-auto">
        <i class="fa-solid fa-house" aria-hidden="true"></i> Go to Homepage
      </a>
      <button type="button" class="inline-flex w-full items-center justify-center gap-3 rounded-2xl border border-gray-200 bg-white px-8 py-4 text-lg font-bold text-gray-700 shadow-md transition-all hover:-translate-y-1 hover:bg-gray-50 sm:w-auto" (click)="goBack()">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Go Back
      </button>
    </div>

    <div class="rounded-3xl border border-gray-100 bg-white p-6 shadow-sm">
      <p class="mb-4 text-center text-sm font-medium uppercase tracking-wider text-gray-400">Popular Destinations</p>
      <div class="flex flex-wrap items-center justify-center gap-3">
        <a routerLink="/products" class="rounded-xl bg-primary-50 px-5 py-2.5 text-sm font-semibold text-primary-700 hover:bg-primary-100">All Products</a>
        <a routerLink="/categories" class="rounded-xl bg-gray-100 px-5 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-200">Categories</a>
        <a routerLink="/brands" class="rounded-xl bg-gray-100 px-5 py-2.5 text-sm font-semibold text-gray-700 hover:bg-gray-200">Brands</a>
      </div>
    </div>
  </div>
</div>
