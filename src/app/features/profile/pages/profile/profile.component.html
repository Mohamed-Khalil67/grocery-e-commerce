<app-page-header
  title="My Account"
  subtitle="Manage your details and your password"
  icon="user"
  theme="blue"
  [crumbs]="[{ label: 'My Account' }]"
/>

<section class="container mx-auto grid items-start gap-6 px-4 py-10 lg:grid-cols-3">
  <aside class="rounded-2xl border border-gray-100 bg-white p-6 shadow-sm">
    <div class="flex flex-col items-center text-center">
      <div class="flex size-20 items-center justify-center rounded-full bg-primary-600 text-3xl font-bold text-white">{{ initial() }}</div>
      <h2 class="mt-4 text-xl font-bold text-gray-900">{{ auth.userName() }}</h2>
      <p class="text-sm text-gray-500">FreshCart member</p>
    </div>

    <nav class="mt-6 space-y-1 border-t border-gray-100 pt-4">
      <a routerLink="/profile/orders" class="flex items-center gap-3 rounded-xl px-4 py-3 font-medium text-gray-700 transition-colors hover:bg-primary-50 hover:text-primary-600">
        <i class="fa-solid fa-box w-5 text-center"></i> My Orders
      </a>
      <a routerLink="/wishlist" class="flex items-center gap-3 rounded-xl px-4 py-3 font-medium text-gray-700 transition-colors hover:bg-primary-50 hover:text-primary-600">
        <i class="fa-regular fa-heart w-5 text-center"></i> My Wishlist
      </a>
      <a routerLink="/cart" class="flex items-center gap-3 rounded-xl px-4 py-3 font-medium text-gray-700 transition-colors hover:bg-primary-50 hover:text-primary-600">
        <i class="fa-solid fa-cart-shopping w-5 text-center"></i> My Cart
      </a>
      <button type="button" class="flex w-full items-center gap-3 rounded-xl px-4 py-3 font-medium text-red-500 transition-colors hover:bg-red-50" (click)="auth.signOut()">
        <i class="fa-solid fa-right-from-bracket w-5 text-center"></i> Sign Out
      </button>
    </nav>
  </aside>

  <div class="space-y-6 lg:col-span-2">
    <app-update-profile-form />
    <app-change-password-form />
  </div>
</section>
