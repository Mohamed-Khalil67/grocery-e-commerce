<!-- Breadcrumb: Home (added by the header itself) / Categories (no link: it is the current page) -->
<app-page-header
  title="All Categories"
  subtitle="Browse our wide range of product categories"
  icon="layer-group"
  [crumbs]="[{ label: 'Categories' }]"
/>

<section class="container mx-auto px-4 py-10">
  <!--
    This page expects ONE thing from categories.component.ts:
      `categories` : a resource with error() and value()
    The value is the API reply: { results, metadata, data: Category[] }
    While the categories load there is nothing to draw here: the loading interceptor already shows the ngx-spinner.
  -->
  @if (categories.error()) {
    <p class="rounded-lg bg-red-50 p-4 text-center text-red-600">Couldn't load the categories. Please try again.</p>
  } @else if (categories.value(); as res) {
    <div class="grid grid-cols-2 gap-6 sm:grid-cols-3 lg:grid-cols-5">
      @for (category of res.data; track category._id) {
        <app-category-card [category]="category" />
      }
    </div>
  }
</section>
