<a
  [routerLink]="['/categories', category()._id]"
  class="group block rounded-xl bg-white p-4 text-center shadow-sm ring-1 ring-gray-100 transition hover:-translate-y-0.5 hover:shadow-md"
>
  <div class="mb-4 aspect-square overflow-hidden rounded-lg bg-gray-50">
    <img
      [src]="category().image"
      [alt]="category().name"
      width="300"
      height="300"
      loading="lazy"
      class="size-full object-cover transition duration-300 group-hover:scale-105"
    />
  </div>
  <h2 class="font-semibold text-gray-800">{{ category().name }}</h2>
</a>
