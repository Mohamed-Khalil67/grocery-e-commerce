<section class="py-10">
  <div class="container mx-auto px-4">
    <div class="grid gap-6 md:grid-cols-2">
      @for (banner of banners; track banner.title) {
        <div class="relative overflow-hidden rounded-2xl bg-linear-to-br p-8 text-white" [class]="banner.gradient">
          <!-- two decorative circles in the corners -->
          <div class="absolute right-0 top-0 size-40 -translate-y-1/2 translate-x-1/2 rounded-full bg-white/10"></div>
          <div class="absolute bottom-0 left-0 size-32 -translate-x-1/2 translate-y-1/2 rounded-full bg-white/10"></div>

          <div class="relative z-10">
            <div class="mb-4 inline-flex items-center gap-2 rounded-full bg-white/20 px-3 py-1 text-sm">
              <span aria-hidden="true">{{ banner.emoji }}</span>
              <span>{{ banner.badge }}</span>
            </div>
            <h3 class="mb-2 text-2xl font-bold md:text-3xl">{{ banner.title }}</h3>
            <p class="mb-4 text-white/80">{{ banner.description }}</p>
            <div class="mb-6 flex items-center gap-4">
              <div class="text-3xl font-bold">{{ banner.discount }}</div>
              <div class="text-sm text-white/70">Use code: <span class="font-bold text-white">{{ banner.code }}</span></div>
            </div>
            <!-- the API has no "newest" sort, so both buttons open the products page -->
            <a
              routerLink="/products"
              class="inline-flex items-center gap-2 rounded-full bg-white px-6 py-3 font-semibold transition-colors hover:bg-gray-100"
              [class]="banner.buttonColor"
            >
              {{ banner.buttonLabel }}
              <i class="fa-solid fa-arrow-right text-sm" aria-hidden="true"></i>
            </a>
          </div>
        </div>
      }
    </div>
  </div>
</section>
