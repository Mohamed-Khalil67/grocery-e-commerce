<app-page-header
  title="Top Brands"
  subtitle="Shop from your favorite brands"
  icon="tags"
  theme="violet"
  [crumbs]="[{ label: 'Brands'}]"
/>

<section class="container mx-auto px-4 py-10">
  <!-- While loading there is nothing to draw: the loading interceptor shows the ngx-spinner. -->
  @if (brands.error()) {
    <p class="rounded-lg bg-red-50 p-4 text-center text-red-600">Couldn't load the brands. Please try again.</p>
  } @else if (brands.value(); as res) {
    @if (res.data.length > 0) {
      <div class="grid grid-cols-2 gap-6 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6">
        @for (brand of res.data; track brand._id) {
          <app-brand-card [brand]="brand" />
        }
      </div>
    } @else {
      <p class="rounded-lg bg-gray-50 p-10 text-center text-gray-500">No brands found.</p>
    }

    <app-pagination [currentPage]="res.metadata.currentPage" [numberOfPages]="res.metadata.numberOfPages" />
  }
</section>
