<a
  [routerLink]="['/brands', brand()._id]"
  class="group block rounded-xl bg-white p-4 text-center shadow-sm ring-1 ring-gray-100 transition hover:-translate-y-0.5 hover:shadow-md"
>
  <div class="mb-3 flex aspect-square items-center justify-center overflow-hidden rounded-lg bg-gray-50 p-4">
    <img
      [src]="brand().image"
      [alt]="brand().name"
      width="200"
      height="200"
      loading="lazy"
      class="max-h-full max-w-full object-contain transition duration-300 group-hover:scale-105"
    />
  </div>
  <h2 class="text-sm font-semibold text-gray-800">{{ brand().name }}</h2>
</a>
