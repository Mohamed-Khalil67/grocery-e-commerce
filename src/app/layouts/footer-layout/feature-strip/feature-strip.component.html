<section class="border-y border-primary-100 bg-primary-50" aria-label="Our promises">
  <div class="container mx-auto grid gap-6 px-4 py-6 sm:grid-cols-2 lg:grid-cols-4">
    @for (feature of features; track feature.title) {
      <div class="flex items-center gap-3">
        <div class="flex size-12 shrink-0 items-center justify-center rounded-xl bg-primary-100">
          <i class="fa-solid text-lg text-primary-600" [class]="feature.icon" aria-hidden="true"></i>
        </div>
        <div>
          <h4 class="text-sm font-semibold text-gray-900">{{ feature.title }}</h4>
          <p class="text-xs text-gray-500">{{ feature.text }}</p>
        </div>
      </div>
    }
  </div>
</section>
