<div class="container mx-auto px-4 py-16 text-center">
  <div class="mx-auto flex size-24 items-center justify-center rounded-full bg-gray-100">
    <i class="fa-solid text-4xl text-gray-400" [class]="'fa-' + icon()"></i>
  </div>

  <h2 class="mt-6 text-2xl font-bold text-gray-800">{{ title() }}</h2>

  @if (message()) {
    <p class="mx-auto mt-2 max-w-md text-gray-500">{{ message() }}</p>
  }

  <div class="mt-6 flex flex-wrap justify-center gap-3">
    <ng-content />
  </div>
</div>
