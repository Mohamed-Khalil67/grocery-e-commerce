<div class="bg-gradient-to-br text-white" [class]="gradients[theme()]">
  <div class="container mx-auto px-4 py-12 sm:py-16">
    <nav class="mb-6 flex items-center gap-2 text-sm text-white/70" aria-label="Breadcrumb">
      <a routerLink="/" class="transition-colors hover:text-white">Home</a>
      @for (crumb of crumbs(); track crumb.label) {
        <span class="text-white/40" aria-hidden="true">/</span>
        @if (crumb.link) {
          <a [routerLink]="crumb.link" class="transition-colors hover:text-white">{{ crumb.label }}</a>
        } @else {
          <span class="font-medium text-white" aria-current="page">{{ crumb.label }}</span>
        }
      }
    </nav>

    <div class="flex items-center gap-5">
      <div
        class="flex size-16 items-center justify-center rounded-2xl bg-white/20 shadow-xl ring-1 ring-white/30 backdrop-blur-sm"
      >
        <i class="fa-solid text-3xl" [class]="'fa-' + icon()" aria-hidden="true"></i>
      </div>
      <div>
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">{{ title() }}</h1>
        @if (subtitle()) {
          <p class="mt-1 text-white/80">{{ subtitle() }}</p>
        }
      </div>
    </div>
  </div>
</div>
